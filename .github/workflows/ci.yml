name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Test (Linux, with a virtual display for VS Code)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test
      - name: Package
        if: runner.os == 'Linux'
        run: npm run package
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: punaise-vsix
          path: packages/extension/punaise.vsix
          if-no-files-found: error
