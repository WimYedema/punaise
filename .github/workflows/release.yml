name: Release

# Pushing a version tag such as v0.1.0 publishes that version to the Marketplace as a
# pre-release. Authentication uses OIDC trusted publishing, so no token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches the manifest version
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: xvfb-run -a npm test
      - name: Package as pre-release
        working-directory: packages/extension
        run: npx vsce package --pre-release --no-dependencies --out punaise.vsix
      - name: Publish pre-release
        working-directory: packages/extension
        run: npx vsce publish --pre-release --oidc --packagePath punaise.vsix
